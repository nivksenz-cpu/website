<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket League 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: ui-sans-serif, system-ui, sans-serif;
            color: white;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="ui" class="absolute top-0 left-0 w-full p-6 flex justify-between items-center pointer-events-none z-10">
        <div class="flex items-center gap-6 bg-slate-900/80 backdrop-blur-md px-6 py-3 rounded-2xl border border-slate-700 shadow-2xl">
            <div class="text-center">
                <div class="text-xs uppercase tracking-widest text-blue-400 font-bold">Blue Team</div>
                <div id="score-blue" class="text-3xl font-black">0</div>
            </div>
            <div class="text-2xl font-black text-slate-500">:</div>
            <div class="text-center">
                <div class="text-xs uppercase tracking-widest text-rose-400 font-bold">Orange Team</div>
                <div id="score-orange" class="text-3xl font-black">0</div>
            </div>
        </div>

        <div class="flex flex-col items-end bg-slate-900/80 backdrop-blur-md px-6 py-3 rounded-2xl border border-slate-700 shadow-2xl w-48">
            <div class="flex justify-between w-full text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">
                <span>Boost</span>
                <span id="boost-text">100%</span>
            </div>
            <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700">
                <div id="boost-bar" class="bg-amber-400 h-full rounded-full transition-all duration-75" style="width: 100%"></div>
            </div>
        </div>
    </div>

    <div id="instructions" class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md px-8 py-4 rounded-2xl border border-slate-700 text-center pointer-events-none shadow-2xl text-sm text-slate-300">
        <span class="font-bold text-white">W A S D / Arrows</span> to Drive &bull; <span class="font-bold text-white">Space</span> to Jump &bull; <span class="font-bold text-white">Shift</span> to Boost &bull; <span class="font-bold text-white">R</span> to Reset
    </div>

    <div id="goal-banner" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300 z-30">
        <div class="text-6xl md:text-8xl font-black tracking-tighter uppercase italic text-amber-400 drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)]">
            Goal!
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let carMesh, ballMesh;
        let arenaWidth = 100, arenaLength = 160;
        
        let car = {
            pos: new THREE.Vector3(0, 1.5, 50),
            vel: new THREE.Vector3(0, 0, 0),
            rot: 0,
            speed: 0,
            maxSpeed: 1.8,
            acceleration: 0.04,
            braking: 0.08,
            friction: 0.98,
            turnSpeed: 0.04,
            boost: 100,
            isJumping: false,
            jumpVel: 0
        };

        let ball = {
            pos: new THREE.Vector3(0, 3, 0),
            vel: new THREE.Vector3(0, 0, 0),
            radius: 4,
            mass: 2
        };

        let keys = {};
        let scoreBlue = 0, scoreOrange = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);
            scene.fog = new THREE.FogExp2(0x0b0f19, 0.005);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 300;
            const d = 100;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            createArena();
            createCar();
            createBall();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => { keys[e.code] = true; });
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });

            animate();
        }

        function createArena() {
            const floorGeo = new THREE.PlaneGeometry(arenaWidth, arenaLength);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x111827, 
                roughness: 0.3,
                metalness: 0.8
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(arenaLength, 20, 0x3b82f6, 0x1f2937);
            grid.position.y = 0.05;
            scene.add(grid);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5, metalness: 0.5 });
            const wallHeight = 15;

            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(2, wallHeight, arenaLength), wallMat);
            leftWall.position.set(-arenaWidth / 2, wallHeight / 2, 0);
            leftWall.castShadow = true;
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(2, wallHeight, arenaLength), wallMat);
            rightWall.position.set(arenaWidth / 2, wallHeight / 2, 0);
            rightWall.castShadow = true;
            rightWall.receiveShadow = true;
            scene.add(rightWall);

            const goalWidth = 36, goalHeight = 12, goalDepth = 10;
            const postMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.5 });

            [-arenaLength / 2, arenaLength / 2].forEach((zPos, idx) => {
                const backWallZ = zPos;
                const sideWallLength = (arenaWidth - goalWidth) / 2;

                const wall1 = new THREE.Mesh(new THREE.BoxGeometry(sideWallLength, wallHeight, 2), wallMat);
                wall1.position.set(-arenaWidth / 2 + sideWallLength / 2, wallHeight / 2, zPos);
                scene.add(wall1);

                const wall2 = new THREE.Mesh(new THREE.BoxGeometry(sideWallLength, wallHeight, 2), wallMat);
                wall2.position.set(arenaWidth / 2 - sideWallLength / 2, wallHeight / 2, zPos);
                scene.add(wall2);

                const topBar = new THREE.Mesh(new THREE.BoxGeometry(goalWidth, 2, 2), postMat);
                topBar.position.set(0, goalHeight, zPos);
                scene.add(topBar);

                const leftPost = new THREE.Mesh(new THREE.BoxGeometry(2, goalHeight, 2), postMat);
                leftPost.position.set(-goalWidth / 2, goalHeight / 2, zPos);
                scene.add(leftPost);

                const rightPost = new THREE.Mesh(new THREE.BoxGeometry(2, goalHeight, 2), postMat);
                rightPost.position.set(goalWidth / 2, goalHeight / 2, zPos);
                scene.add(rightPost);
            });
        }

        function createCar() {
            carMesh = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, metalness: 0.8, roughness: 0.2 });
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.9, roughness: 0.1 });
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 7), bodyMat);
            body.position.y = 1;
            body.castShadow = true;
            carMesh.add(body);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(3, 1.2, 3.5), cabinMat);
            cabin.position.set(0, 2.1, -0.5);
            cabin.castShadow = true;
            carMesh.add(cabin);

            const spoiler = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.3, 1), bodyMat);
            spoiler.position.set(0, 2.2, -3.2);
            spoiler.castShadow = true;
            carMesh.add(spoiler);

            [-2.1, 2.1].forEach(x => {
                [-2.2, 2.2].forEach(z => {
                    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.8, 16), wheelMat);
                    wheel.rotation.z = Math.PI / 2;
                    wheel.position.set(x, 0.8, z);
                    wheel.castShadow = true;
                    carMesh.add(wheel);
                });
            });

            scene.add(carMesh);
        }

        function createBall() {
            const ballGeo = new THREE.SphereGeometry(ball.radius, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ 
                color: 0xf59e0b, 
                roughness: 0.2, 
                metalness: 0.4,
                emissive: 0xd97706,
                emissiveIntensity: 0.3
            });
            ballMesh = new THREE.Mesh(ballGeo, ballMat);
            ballMesh.castShadow = true;
            scene.add(ballMesh);
        }

        function updateGame() {
            if (keys['KeyW'] || keys['ArrowUp']) {
                car.speed = Math.min(car.speed + car.acceleration, car.maxSpeed);
            } else if (keys['KeyS'] || keys['ArrowDown']) {
                car.speed = Math.max(car.speed - car.braking, -car.maxSpeed / 2);
            } else {
                car.speed *= car.friction;
            }

            if (keys['ShiftLeft'] || keys['ShiftRight']) {
                if (car.boost > 0) {
                    car.speed += 0.08;
                    car.boost = Math.max(0, car.boost - 0.6);
                }
            } else {
                car.boost = Math.min(100, car.boost + 0.2);
            }

            if (Math.abs(car.speed) > 0.05) {
                if (keys['KeyA'] || keys['ArrowLeft']) {
                    car.rot += car.turnSpeed * Math.sign(car.speed);
                }
                if (keys['KeyD'] || keys['ArrowRight']) {
                    car.rot -= car.turnSpeed * Math.sign(car.speed);
                }
            }

            if (keys['Space'] && !car.isJumping) {
                car.isJumping = true;
                car.jumpVel = 0.6;
            }

            if (car.isJumping) {
                car.pos.y += car.jumpVel;
                car.jumpVel -= 0.03;
                if (car.pos.y <= 1.5) {
                    car.pos.y = 1.5;
                    car.isJumping = false;
                    car.jumpVel = 0;
                }
            }

            const forward = new THREE.Vector3(Math.sin(car.rot), 0, Math.cos(car.rot));
            car.pos.addScaledVector(forward, car.speed);

            const halfW = arenaWidth / 2 - 2;
            const halfL = arenaLength / 2 - 2;
            car.pos.x = Math.max(-halfW, Math.min(halfW, car.pos.x));
            car.pos.z = Math.max(-halfL, Math.min(halfL, car.pos.z));

            carMesh.position.copy(car.pos);
            carMesh.rotation.y = car.rot;

            ball.vel.multiplyScalar(0.99);
            ball.pos.add(ball.vel);

            const bHalfW = arenaWidth / 2 - ball.radius;
            const bHalfL = arenaLength / 2 - ball.radius;

            if (ball.pos.x < -bHalfW) { ball.pos.x = -bHalfW; ball.vel.x *= -0.8; }
            if (ball.pos.x > bHalfW) { ball.pos.x = bHalfW; ball.vel.x *= -0.8; }

            if (ball.pos.z < -bHalfL) {
                if (Math.abs(ball.pos.x) < 18 && ball.pos.y < 12) {
                    scoreBlue++;
                    triggerGoal();
                } else {
                    ball.pos.z = -bHalfL;
                    ball.vel.z *= -0.8;
                }
            }
            if (ball.pos.z > bHalfL) {
                if (Math.abs(ball.pos.x) < 18 && ball.pos.y < 12) {
                    scoreOrange++;
                    triggerGoal();
                } else {
                    ball.pos.z = bHalfL;
                    ball.vel.z *= -0.8;
                }
            }

            ball.pos.y = Math.max(ball.radius, ball.pos.y);

            const dist = car.pos.distanceTo(ball.pos);
            const minDist = ball.radius + 2.5;
            if (dist < minDist) {
                const normal = new THREE.Vector3().subVectors(ball.pos, car.pos).normalize();
                const impactForce = Math.max(Math.abs(car.speed) * 1.5, 0.8);
                ball.vel.copy(normal.multiplyScalar(impactForce * 2.5));
                ball.vel.y += 0.5;
            }

            ballMesh.position.copy(ball.pos);

            const targetCamPos = new THREE.Vector3(
                car.pos.x - Math.sin(car.rot) * 18,
                car.pos.y + 8,
                car.pos.z - Math.cos(car.rot) * 18
            );
            camera.position.lerp(targetCamPos, 0.1);
            camera.lookAt(car.pos.clone().add(new THREE.Vector3(0, 2, 0)));

            document.getElementById('score-blue').innerText = scoreBlue;
            document.getElementById('score-orange').innerText = scoreOrange;
            document.getElementById('boost-bar').style.width = Math.round(car.boost) + '%';
            document.getElementById('boost-text').innerText = Math.round(car.boost) + '%';

            if (keys['KeyR']) {
                resetPositions();
            }
        }

        function triggerGoal() {
            const banner = document.getElementById('goal-banner');
            banner.style.opacity = '1';
            setTimeout(() => { banner.style.opacity = '0'; }, 1500);
            resetPositions();
        }

        function resetPositions() {
            car.pos.set(0, 1.5, 50);
            car.vel.set(0, 0, 0);
            car.speed = 0;
            car.rot = 0;
            car.boost = 100;
            ball.pos.set(0, 3, 0);
            ball.vel.set(0, 0, 0);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            renderer.render(scene, camera);
        }

        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
