<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacked By Nck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #030712;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
        }
        .heading-font {
            font-family: 'Orbitron', sans-serif;
        }
        /* Neon green text glow effects */
        .neon-glow {
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.8),
                         0 0 20px rgba(34, 197, 94, 0.6),
                         0 0 40px rgba(34, 197, 94, 0.4),
                         0 0 80px rgba(34, 197, 94, 0.2);
        }
        .sub-glow {
            text-shadow: 0 0 5px rgba(34, 197, 94, 0.6),
                         0 0 15px rgba(34, 197, 94, 0.4);
        }
        /* Scanline effect */
        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
        }
        /* Glitch animation */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        .glitch-anim:hover {
            animation: glitch 0.3s infinite;
        }
    </style>
</head>
<body class="relative flex items-center justify-center h-screen w-screen text-green-500 select-none">

    <canvas id="matrixCanvas" class="absolute inset-0 z-0 block w-full h-full opacity-30"></canvas>

    <div class="absolute inset-0 z-10 scanlines pointer-events-none"></div>

    <main class="relative z-20 text-center px-6 max-w-3xl mx-auto">
        <!-- Status indicator -->
        <div class="inline-flex items-center space-x-2 bg-green-950/40 border border-green-500/30 px-4 py-1.5 rounded-full mb-6 backdrop-blur-md shadow-lg shadow-green-900/20">
            <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-ping"></span>
            <span class="text-xs uppercase tracking-widest text-green-400 font-bold">System Compromised</span>
        </div>

        <!-- Main Title -->
        <h1 class="heading-font text-5xl sm:text-7xl md:text-8xl font-black tracking-wider uppercase mb-4 neon-glow glitch-anim cursor-default">
            Hacked By Nck
        </h1>

        <!-- Subtitle / Hacker terminal message -->
        <div class="bg-black/60 border border-green-500/40 rounded-xl p-6 backdrop-blur-xl shadow-2xl shadow-green-950/50">
            <p class="text-lg sm:text-xl text-green-300 sub-glow mb-3">
                &gt; Security is just an illusion. Stay safe, stay humble.
            </p>
            <div class="flex items-center justify-center space-x-2 text-xs text-green-500/70 font-mono">
                <span>[ROOT_ACCESS: GRANTED]</span>
                <span>•</span>
                <span>[TARGET: SECURED]</span>
            </div>
        </div>

        <!-- Footer watermark -->
        <div class="mt-8 text-xs text-green-600/60 tracking-widest uppercase">
            // Authorized Simulation Environment
        </div>
    </main>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas to fill window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Characters for matrix rain (mix of Latin, numbers, and cyber glyphs)
        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-<>?/\\|';
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];

        // Initialize drops
        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            // Semi-transparent black to create trailing fade effect
            ctx.fillStyle = 'rgba(3, 7, 18, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#22c55e'; // Hacker green
            ctx.font = fontSize + 'px "Share Tech Mono", monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        // Loop animation
        setInterval(drawMatrix, 35);

        // Update column count on resize
        window.addEventListener('resize', () => {
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = 1;
            }
        });
    </script>
</body>
</html>
