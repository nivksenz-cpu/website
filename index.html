<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket League Mini-Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0f19; font-family: 'Inter', sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body class="bg-slate-950 text-white">

    <div id="hud" class="absolute top-0 left-0 w-full p-6 flex justify-between items-start pointer-events-none z-10">
        <div class="flex items-center gap-6 bg-slate-900/80 backdrop-blur-md px-6 py-3 rounded-2xl border border-slate-800 shadow-2xl">
            <div class="text-center">
                <span class="text-xs uppercase tracking-widest text-blue-400 font-bold block">Blue Team</span>
                <span id="blue-score" class="text-4xl font-black">0</span>
            </div>
            <span class="text-2xl font-bold text-slate-600">:</span>
            <div class="text-center">
                <span class="text-xs uppercase tracking-widest text-orange-400 font-bold block">Orange Team</span>
                <span id="orange-score" class="text-4xl font-black">0</span>
            </div>
        </div>

        <div class="flex flex-col items-end gap-2 bg-slate-900/80 backdrop-blur-md px-6 py-4 rounded-2xl border border-slate-800 shadow-2xl w-64">
            <div class="flex justify-between w-full text-sm font-semibold">
                <span class="text-cyan-400 tracking-wider">BOOST</span>
                <span id="boost-text" class="text-cyan-400 font-mono">100%</span>
            </div>
            <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700">
                <div id="boost-bar" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full rounded-full transition-all duration-75" style="width: 100%;"></div>
            </div>
            <div class="flex justify-between w-full text-xs text-slate-400 mt-1">
                <span>Cam: <strong id="cam-mode" class="text-white">Car Cam</strong></span>
                <span>Speed: <strong id="speed-val" class="text-white">0</strong> km/h</span>
            </div>
        </div>
    </div>

    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md px-6 py-3 rounded-2xl border border-slate-800 shadow-2xl pointer-events-none z-10 flex gap-6 text-xs text-slate-300">
        <div><span class="text-cyan-400 font-bold">W/S</span> Throttle / Pitch</div>
        <div><span class="text-cyan-400 font-bold">A/D</span> Steer / Roll</div>
        <div><span class="text-cyan-400 font-bold">K</span> Jump</div>
        <div><span class="text-cyan-400 font-bold">J</span> Boost</div>
        <div><span class="text-cyan-400 font-bold">Space</span> Ball Cam</div>
        <div><span class="text-cyan-400 font-bold">Delete</span> Reset</div>
    </div>

    <div id="goal-banner" class="absolute inset-0 flex items-center justify-center pointer-events-none z-20 opacity-0 transition-opacity duration-300">
        <h1 id="goal-text" class="text-7xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] scale-75 transition-transform duration-300">GOAL!</h1>
    </div>

    <script>
        const keys = { w: false, a: false, s: false, d: false, j: false, k: false, space: false };
        let ballCam = false;
        let blueScore = 0;
        let orangeScore = 0;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;
            if (e.key === 'j' || e.key === 'J') keys.j = true;
            if (e.key === 'k' || e.key === 'K') keys.k = true;
            if (e.key === ' ') {
                e.preventDefault();
                ballCam = !ballCam;
                document.getElementById('cam-mode').innerText = ballCam ? 'Ball Cam' : 'Car Cam';
            }
            if (e.key === 'Delete' || e.key === 'Backspace') {
                resetPositions();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = false;
            if (e.key === 'j' || e.key === 'J') keys.j = false;
            if (e.key === 'k' || e.key === 'K') keys.k = false;
        });

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060913);
        scene.fog = new THREE.FogExp2(0x060913, 0.003);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(0, 150, 100);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 500;
        const d = 120;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        const fieldWidth = 140;
        const fieldLength = 220;
        const wallHeight = 25;

        const floorGeo = new THREE.PlaneGeometry(fieldWidth, fieldLength);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8, metalness: 0.2 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(fieldLength, 22, 0x3b82f6, 0x1e293b);
        gridHelper.position.y = 0.1;
        scene.add(gridHelper);

        const centerCircleGeo = new THREE.RingGeometry(18, 19, 32);
        const centerMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, side: THREE.DoubleSide });
        const centerCircle = new THREE.Mesh(centerCircleGeo, centerMat);
        centerCircle.rotation.x = -Math.PI / 2;
        centerCircle.position.y = 0.15;
        scene.add(centerCircle);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.5, metalness: 0.5 });
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(2, wallHeight, fieldLength), wallMat);
        leftWall.position.set(-fieldWidth/2 - 1, wallHeight/2, 0);
        leftWall.castShadow = true; leftWall.receiveShadow = true;
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(2, wallHeight, fieldLength), wallMat);
        rightWall.position.set(fieldWidth/2 + 1, wallHeight/2, 0);
        rightWall.castShadow = true; rightWall.receiveShadow = true;
        scene.add(rightWall);

        const goalWidth = 40;
        const goalHeight = 15;

        function createGoal(zPos, colorHex) {
            const group = new THREE.Group();
            const postGeo = new THREE.CylinderGeometry(1, 1, goalHeight, 16);
            const postMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.8 });

            const p1 = new THREE.Mesh(postGeo, postMat);
            p1.position.set(-goalWidth/2, goalHeight/2, zPos);
            p1.castShadow = true;
            group.add(p1);

            const p2 = new THREE.Mesh(postGeo, postMat);
            p2.position.set(goalWidth/2, goalHeight/2, zPos);
            p2.castShadow = true;
            group.add(p2);

            const crossGeo = new THREE.CylinderGeometry(1, 1, goalWidth, 16);
            const cross = new THREE.Mesh(crossGeo, postMat);
            cross.rotation.z = Math.PI / 2;
            cross.position.set(0, goalHeight, zPos);
            cross.castShadow = true;
            group.add(cross);

            return group;
        }

        scene.add(createGoal(-fieldLength/2, 0x3b82f6));
        scene.add(createGoal(fieldLength/2, 0xf97316));

        const backWallTopZ = new THREE.Mesh(new THREE.BoxGeometry(fieldWidth, wallHeight - goalHeight, 2), wallMat);
        backWallTopZ.position.set(0, wallHeight - (wallHeight - goalHeight)/2, -fieldLength/2 - 1);
        scene.add(backWallTopZ);

        const backWallTopZ2 = new THREE.Mesh(new THREE.BoxGeometry(fieldWidth, wallHeight - goalHeight, 2), wallMat);
        backWallTopZ2.position.set(0, wallHeight - (wallHeight - goalHeight)/2, fieldLength/2 + 1);
        scene.add(backWallTopZ2);

        const carGroup = new THREE.Group();
        const carBody = new THREE.Mesh(
            new THREE.BoxGeometry(4, 2, 8),
            new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.8 })
        );
        carBody.position.y = 1.2;
        carBody.castShadow = true;
        carGroup.add(carBody);

        const carTop = new THREE.Mesh(
            new THREE.BoxGeometry(3.2, 1.5, 4),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.1, metalness: 0.9 })
        );
        carTop.position.set(0, 2.7, -0.5);
        carTop.castShadow = true;
        carGroup.add(carTop);

        const spoiler = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.3, 1), wallMat);
        spoiler.position.set(0, 3.2, -3.2);
        spoiler.castShadow = true;
        carGroup.add(spoiler);

        scene.add(carGroup);

        const ballRadius = 3.5;
        const ballGeo = new THREE.SphereGeometry(ballRadius, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2, metalness: 0.1 });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.castShadow = true;
        scene.add(ball);

        const ballPattern = new THREE.Mesh(
            new THREE.IcosahedronGeometry(ballRadius * 1.01, 1),
            new THREE.MeshBasicMaterial({ color: 0x0f172a, wireframe: true })
        );
        ball.add(ballPattern);

        let carX = 0, carZ = 40, carY = 0;
        let carVelX = 0, carVelZ = 0, carVelY = 0;
        let carYaw = 0;
        let carPitch = 0;
        let carRoll = 0;
        let carSpeed = 0;
        let boost = 100;
        let isJumping = false;

        let ballX = 0, ballZ = -30, ballY = ballRadius;
        let ballVelX = 0, ballVelZ = 0, ballVelY = 0;

        let camPos = new THREE.Vector3(0, 10, 60);
        let camTarget = new THREE.Vector3(0, 0, 40);

        function resetPositions() {
            carX = 0; carZ = 40; carY = 0;
            carVelX = 0; carVelZ = 0; carVelY = 0;
            carYaw = 0; carPitch = 0; carRoll = 0; carSpeed = 0;
            boost = 100;
            isJumping = false;

            ballX = 0; ballZ = -30; ballY = ballRadius;
            ballVelX = 0; ballVelZ = 0; ballVelY = 0;
        }

        function showGoal(teamText) {
            const banner = document.getElementById('goal-banner');
            const text = document.getElementById('goal-text');
            text.innerText = teamText + " SCORED!";
            banner.style.opacity = '1';
            text.style.transform = 'scale(1)';
            setTimeout(() => {
                banner.style.opacity = '0';
                text.style.transform = 'scale(0.75)';
                resetPositions();
            }, 2000);
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let dt = clock.getDelta();
            if (dt > 0.1) dt = 0.1;

            const maxSpeed = 1.3;
            const acceleration = 0.035;
            const friction = 0.98;
            const turnSpeed = 0.045;

            if (carY <= 0.05) {
                if (keys.w) {
                    carSpeed += acceleration;
                    if (carSpeed > maxSpeed) carSpeed = maxSpeed;
                } else if (keys.s) {
                    carSpeed -= acceleration;
                    if (carSpeed < -maxSpeed / 2) carSpeed = -maxSpeed / 2;
                } else {
                    carSpeed *= friction;
                }

                if (keys.j && boost > 0) {
                    carSpeed += acceleration * 2.5;
                    boost = Math.max(0, boost - 35 * dt);
                } else {
                    boost = Math.min(100, boost + 15 * dt);
                }

                if (Math.abs(carSpeed) > 0.05) {
                    if (keys.a) carYaw += turnSpeed * (carSpeed > 0 ? 1 : -1);
                    if (keys.d) carYaw -= turnSpeed * (carSpeed > 0 ? 1 : -1);
                }

                carPitch *= 0.8;
                carRoll *= 0.8;

                if (keys.k && !isJumping) {
                    carVelY = 0.85;
                    isJumping = true;
                }
            } else {
                if (keys.w) carPitch -= 2.0 * dt;
                if (keys.s) carPitch += 2.0 * dt;
                if (keys.a) carRoll += 2.5 * dt;
                if (keys.d) carRoll -= 2.5 * dt;

                if (keys.j && boost > 0) {
                    const forwardDir = new THREE.Vector3(Math.sin(carYaw), Math.sin(-carPitch), Math.cos(carYaw));
                    carVelX += forwardDir.x * 0.8 * dt * 60;
                    carVelY += forwardDir.y * 0.8 * dt * 60;
                    carVelZ += forwardDir.z * 0.8 * dt * 60;
                    boost = Math.max(0, boost - 45 * dt);
                } else {
                    boost = Math.min(100, boost + 15 * dt);
                }
            }

            carVelY -= 2.5 * dt;
            carY += carVelY;
            if (carY <= 0) {
                carY = 0;
                carVelY = 0;
                isJumping = false;
            }

            if (carY === 0) {
                carVelX = Math.sin(carYaw) * carSpeed;
                carVelZ = Math.cos(carYaw) * carSpeed;
            } else {
                carVelX *= 0.99;
                carVelZ *= 0.99;
            }

            carX += carVelX;
            carZ += carVelZ;

            const boundX = fieldWidth / 2 - 3;
            const boundZ = fieldLength / 2 - 3;

            if (carX < -boundX) { carX = -boundX; carSpeed = 0; carVelX = 0; }
            if (carX > boundX) { carX = boundX; carSpeed = 0; carVelX = 0; }
            if (carZ < -boundZ) { carZ = -boundZ; carSpeed = 0; carVelZ = 0; }
            if (carZ > boundZ) { carZ = boundZ; carSpeed = 0; carVelZ = 0; }

            carGroup.position.set(carX, carY, carZ);
            carGroup.rotation.set(0, 0, 0);
            carGroup.rotation.y = carYaw;
            carGroup.rotation.x = carPitch;
            carGroup.rotation.z = carRoll;

            ballVelX *= 0.992;
            ballVelZ *= 0.992;
            ballVelY -= 0.6 * dt;

            ballX += ballVelX;
            ballZ += ballVelZ;
            ballY += ballVelY;

            if (ballY < ballRadius) {
                ballY = ballRadius;
                ballVelY = -ballVelY * 0.35;
                ballVelX *= 0.92;
                ballVelZ *= 0.92;
            }

            const ballBoundX = fieldWidth / 2 - ballRadius;
            const ballBoundZ = fieldLength / 2 - ballRadius;

            if (ballX < -ballBoundX) { ballX = -ballBoundX; ballVelX = -ballVelX * 0.4; }
            if (ballX > ballBoundX) { ballX = ballBoundX; ballVelX = -ballVelX * 0.4; }

            if (ballZ < -ballBoundZ) {
                if (Math.abs(ballX) < goalWidth / 2 && ballY < goalHeight) {
                    if (ballZ < -fieldLength / 2 - 5) {
                        orangeScore++;
                        document.getElementById('orange-score').innerText = orangeScore;
                        showGoal("ORANGE TEAM");
                    }
                } else {
                    ballZ = -ballBoundZ;
                    ballVelZ = -ballVelZ * 0.4;
                }
            } else if (ballZ > ballBoundZ) {
                if (Math.abs(ballX) < goalWidth / 2 && ballY < goalHeight) {
                    if (ballZ > fieldLength / 2 + 5) {
                        blueScore++;
                        document.getElementById('blue-score').innerText = blueScore;
                        showGoal("BLUE TEAM");
                    }
                } else {
                    ballZ = ballBoundZ;
                    ballVelZ = -ballVelZ * 0.4;
                }
            }

            const dx = ballX - carX;
            const dy = ballY - (carY + 1.5);
            const dz = ballZ - carZ;
            const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
            const minDist = ballRadius + 3;

            if (dist < minDist) {
                const nx = dx / dist;
                const ny = dy / dist;
                const nz = dz / dist;
                
                const carHitForce = Math.sqrt(carVelX * carVelX + carVelZ * carVelZ) * 3.0 + 0.6;
                ballVelX = nx * carHitForce + carVelX * 1.2;
                ballVelY = ny * carHitForce + 0.3;
                ballVelZ = nz * carHitForce + carVelZ * 1.2;
            }

            ball.position.set(ballX, ballY, ballZ);
            ball.rotation.x += ballVelZ * 0.05;
            ball.rotation.z -= ballVelX * 0.05;

            let targetCamPos = new THREE.Vector3();
            let targetLookAt = new THREE.Vector3();

            if (ballCam) {
                const carPos = new THREE.Vector3(carX, carY + 2, carZ);
                const ballPos = new THREE.Vector3(ballX, ballY, ballZ);
                const dirToBall = new THREE.Vector3().subVectors(ballPos, carPos).normalize();
                
                targetCamPos.copy(carPos).sub(dirToBall.multiplyScalar(22)).add(new THREE.Vector3(0, 8, 0));
                targetLookAt.copy(ballPos).add(carPos).multiplyScalar(0.5);
            } else {
                targetCamPos.set(
                    carX - Math.sin(carYaw) * 22,
                    carY + 9,
                    carZ - Math.cos(carYaw) * 22
                );
                targetLookAt.set(
                    carX + Math.sin(carYaw) * 10,
                    carY + 2,
                    carZ + Math.cos(carYaw) * 10
                );
            }

            camPos.lerp(targetCamPos, 0.12);
            camTarget.lerp(targetLookAt, 0.15);
            camera.position.copy(camPos);
            camera.lookAt(camTarget);

            document.getElementById('boost-bar').style.width = boost + '%';
            document.getElementById('boost-text').innerText = Math.round(boost) + '%';
            document.getElementById('speed-val').innerText = Math.round(Math.abs(carSpeed) * 90);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
